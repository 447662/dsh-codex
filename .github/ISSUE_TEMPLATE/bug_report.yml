name: Bug report
description: Something in dsh-native-codex-cli does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The plugin writes everything it does to
        `~/.dsh/logs/dsh-native-codex-cli.log` — the last few dozen lines usually identify
        the failing layer on their own. On Windows that is
        `C:\Users\<you>\.dsh\logs\dsh-native-codex-cli.log`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
      placeholder: |
        1. Opened the Codex panel
        2. Pasted a screenshot and pressed send
        3. Expected the message to reach Codex; instead the composer reset
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Shown in Settings, or `dsh --version`.
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex CLI version
      description: Output of `codex --version`.
      placeholder: codex-cli 0.153.4
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install the plugin?
      options:
        - dsh plugin add git+https://github.com/447662/dsh-native-codex-cli.git
        - Local clone / junction
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 26100 / macOS 15 / Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Plugin log tail
      description: |
        Paste the last ~40 lines of `~/.dsh/logs/dsh-native-codex-cli.log`.
        The host logs a line per phase (`[boot]`, `[host]`, `[routes]`), and the
        client posts its own diagnostics (`slot-registered`, `composer-hooks`,
        `render:*`) to the same file — so the failing layer is usually obvious.
      render: text
    validations:
      required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Screenshots, related configuration, or things you already ruled out.
    validations:
      required: false
